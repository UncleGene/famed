[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "famed"
version = "0.1.0"
description = "Local-first family medical record in Obsidian, maintained by your AI coding agent"
readme = "README.md"
keywords = ["medical-records", "personal-health-record", "obsidian", "local-first", "fhir", "loinc", "rxnorm", "pharmacogenomics", "ai-agents"]
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "famed contributors" }
]
dependencies = [
  "PyYAML>=6.0.1",
  "pypdf>=4.3.0"
]

[project.urls]
Repository = "https://github.com/UncleGene/famed"
Issues = "https://github.com/UncleGene/famed/issues"

[project.optional-dependencies]
ocr = [
  "Pillow>=10.0",
  "pytesseract>=0.3.0"
]
dev = [
  "pyrefly",
  "pytest>=8.3.0",
  "ruff==0.15.12",
  "types-PyYAML>=6.0.12",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/famed"]
