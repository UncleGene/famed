have_fun: false
memory_config:
  disabled: false
code_review:
  disable: false
  comment_severity_threshold: MEDIUM
  max_review_comments: -1
  pull_request_opened:
    help: false
    summary: true
    code_review: true
    include_drafts: true
ignore_patterns:
  - "data/**"
  - "famed-vault/**"
  - "tmp/**"
  - ".venv/**"
  - "__pycache__/**"
  - "*.db"
  - "*.sqlite"
  - "*.sqlite3"
  - "*.pdf"
  - "*.png"
  - "*.jpg"
  - "*.jpeg"
