description = "Add or update a functional requirement."
prompt = """
Follow the famed project guide and current sources below. Use your host
environment's planning, review, and validation workflows where they apply.

Project guide:
@{AGENTS.md}

Current sources:
@{docs/CORE.md}
@{docs/REQUIREMENTS.md}
@{docs/DECISIONS.md}
@{docs/SYSTEM.md}
@{docs/PLAN.md}

Task:
Add or update a functional requirement from the user's input. Include
scenarios, edge cases, acceptance criteria, and `Links:` to affected ADRs.
Identify affected SYSTEM sections, PLAN items, procedures, skills, and tests.
Preserve existing valid constraints. Ask for confirmation before editing.

User input:
{{args}}
"""
